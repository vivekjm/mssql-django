name: Validate JSON review fixes 576
on:
  push:
    branches: [maintenance/json-576-validation-20260906]
  workflow_dispatch:
permissions:
  contents: read
env:
  PR_HEAD: 022216788e9510b8c8ec638313cc24e6aad0b63c
jobs:
  sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.10', django: '3.2', spec: 'Django~=3.2.0'}
          - {python: '3.12', django: '5.2', spec: 'Django~=5.2.0'}
          - {python: '3.13', django: '6.1', spec: 'Django~=6.1.0'}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: MyPassword42
        ports: ['1433:1433']
    env:
      MSSQL_PASSWORD: MyPassword42
      MSSQL_HOST: 127.0.0.1
      MSSQL_DRIVER: ODBC Driver 18 for SQL Server
      DJANGO_SETTINGS_MODULE: validation_settings
      DJANGO_SPEC: ${{ matrix.spec }}
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 022216788e9510b8c8ec638313cc24e6aad0b63c
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 71e03aceb927534ff9306581fc2df0816009aceb
          path: harness
          sparse-checkout: .github/scripts/pr576-review-fixes.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ODBC and backend dependencies
        run: |
          curl -fsSL -o /tmp/ms-prod.deb "https://packages.microsoft.com/config/ubuntu/$(grep VERSION_ID /etc/os-release | cut -d '"' -f 2)/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/ms-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          python -m pip install -e '.[test]' "$DJANGO_SPEC" flake8
      - name: Reproduce failures, run all tests, and validate scoped source
        run: |
          python - <<'PY'
          import json, os, re, runpy, subprocess, time, pyodbc
          from pathlib import Path
          Path('validation_settings.py').write_text('from testapp.settings import *\nfor alias in ("default", "other"):\n    DATABASES[alias]["OPTIONS"]["extra_params"] = "TrustServerCertificate=yes"\n')
          for attempt in range(30):
              try:
                  cn = pyodbc.connect('DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;UID=sa;PWD=MyPassword42;DATABASE=master;TrustServerCertificate=yes', timeout=5)
                  cn.close()
                  break
              except pyodbc.Error:
                  if attempt == 29:
                      raise
                  time.sleep(5)
          namespace = runpy.run_path('../harness/.github/scripts/pr576-review-fixes.py')
          add_tests = namespace['add_tests']
          add_tests.__globals__['TESTS'] = add_tests.__globals__['TESTS'].lstrip('\n')
          add_tests()
          def run_test(label, logfile, expected_failure=None):
              command = ['python', 'manage.py', 'test', label, '--settings=validation_settings', '--noinput', '-v', '2']
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              Path(logfile).write_text(result.stdout)
              print(label, 'exit=', result.returncode, flush=True)
              if expected_failure:
                  assert result.returncode != 0 and expected_failure in result.stdout, result.stdout
              else:
                  assert result.returncode == 0, result.stdout
                  print(result.stdout[-700:], flush=True)
          cases = [
              ('test_json_null_keys_preserve_trailing_spaces', 'AssertionError: Sequences differ'),
              ('test_json_null_keys_in_filtered_aggregates', '(130)'),
              ('test_json_null_keys_in_grouped_case_annotations', '(144)'),
          ]
          for name, marker in cases:
              run_test('testapp.tests.test_jsonfield.TestJSONField.' + name, 'baseline-' + name + '.log', marker)
          namespace['apply_fixes']()
          run_test('testapp.tests.test_jsonfield', 'jsonfield.log')
          run_test('testapp', 'testapp.log')
          subprocess.run(['python', '-m', 'compileall', '-q', 'mssql', 'testapp'], check=True)
          lint = subprocess.run(['flake8', 'testapp/tests/test_jsonfield.py'], text=True, stdout=subprocess.PIPE)
          Path('lint-tests.log').write_text(lint.stdout)
          assert lint.returncode == 0, lint.stdout
          patch = subprocess.check_output(['git', 'diff', '--unified=0', '--', 'mssql/compiler.py', 'mssql/functions.py'], text=True)
          changed_lines, path = {}, None
          for line in patch.splitlines():
              if line.startswith('+++ b/'):
                  path = line[6:]
              match = re.match(r'@@ .* \+(\d+)(?:,(\d+))? @@', line)
              if match:
                  start, length = int(match[1]), int(match[2] or 1)
                  changed_lines.setdefault(path, set()).update(range(start, start + length))
          result = subprocess.run(['flake8', 'mssql/compiler.py', 'mssql/functions.py'], text=True, stdout=subprocess.PIPE)
          errors = [line for line in result.stdout.splitlines() if int(line.split(':', 3)[1]) in changed_lines.get(line.split(':', 3)[0], set())]
          Path('lint-production.log').write_text('\n'.join(errors))
          assert not errors, '\n'.join(errors)
          subprocess.run(['git', 'diff', '--check'], check=True)
          allowed = {'mssql/compiler.py', 'mssql/functions.py', 'testapp/tests/test_jsonfield.py'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == allowed, changed
          report = {'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'parents': [os.environ['PR_HEAD']], 'files': [{'path': path, 'mode': '100644', 'type': 'blob', 'content': Path(path).read_text()} for path in sorted(allowed)]}
          Path('validated-changes.json').write_text(json.dumps(report, indent=2))
          Path('validated.patch').write_bytes(subprocess.check_output(['git', 'diff', '--', *sorted(allowed)]))
          print('All tests, changed-line lint, compilation and diff checks passed.', flush=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mssql-576-${{ matrix.django }}-20260916
          path: |
            source/validated-changes.json
            source/validated.patch
            source/baseline-*.log
            source/jsonfield.log
            source/testapp.log
            source/lint-tests.log
            source/lint-production.log
          retention-days: 7
  stage-candidate:
    needs: sqlserver
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mssql-576-*-20260916
          path: results
      - name: Stage identical candidates that passed every matrix job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          manifests = sorted(Path('results').glob('*/validated-changes.json'))
          assert len(manifests) == 3
          reports = [json.loads(path.read_text()) for path in manifests]
          assert all(report == reports[0] for report in reports)
          report = reports[0]
          assert report['parents'] == [os.environ['PR_HEAD']]
          assert {file['path'] for file in report['files']} == {'mssql/compiler.py', 'mssql/functions.py', 'testapp/tests/test_jsonfield.py'}
          root = 'https://api.github.com/repos/vivekjm/mssql-django/'
          def request(path, data=None):
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'}
              req = urllib.request.Request(root + path, data=None if data is None else json.dumps(data).encode(), headers=headers, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          assert request('git/ref/heads/fix/json-key-iexact-null')['object']['sha'] == os.environ['PR_HEAD']
          tree = request('git/trees', {'base_tree': report['base_tree'], 'tree': report['files']})
          commit = request('git/commits', {'message': 'fix: preserve JSON key identity and lift null indicators out of aggregates', 'tree': tree['sha'], 'parents': report['parents']})
          request('git/refs', {'ref': 'refs/heads/maintenance/json-576-validated-20260916', 'sha': commit['sha']})
          print('CANDIDATE_SHA=' + commit['sha'])
          PY
